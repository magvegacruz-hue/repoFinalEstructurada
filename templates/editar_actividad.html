{% extends "base.html" %}

{% block contenido %}
<div class="card">
  <div class="card-body">
    <h5 class="card-title">Editar actividad</h5>
    <p class="text-muted">
      Modifica la información de la actividad seleccionada.
    </p>

    <form method="post"
          action="{{ url_for('editar_actividad_ruta', id_actividad=actividad.id) }}"
          class="row g-3">

      <div class="col-md-6">
        <label class="form-label">Nombre de la actividad</label>
        <input name="nombre" class="form-control" value="{{ actividad.nombre }}" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Lugar</label>
        <input name="lugar" class="form-control" value="{{ actividad.lugar }}" required>
      </div>

      <div class="col-12">
        <label class="form-label">Descripción</label>
        <textarea name="descripcion" class="form-control" rows="3">
          {{ actividad.descripcion }}
        </textarea>
      </div>

      <div class="col-md-4">
        <label class="form-label">Fecha</label>
        <input type="date" name="fecha" class="form-control"
               value="{{ actividad.fecha }}" required>
      </div>

      <div class="col-md-4">
        <label class="form-label">Hora de inicio</label>
        <input type="time" name="hora_inicio" class="form-control"
               value="{{ actividad.hora_inicio }}" required>
      </div>

      <div class="col-md-4">
        <label class="form-label">Hora de fin</label>
        <input type="time" name="hora_fin" class="form-control"
               value="{{ actividad.hora_fin }}" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Beneficio</label>
        <select name="beneficio" class="form-select" required>
          <option value="Horas laborales"
            {% if actividad.beneficio == "Horas laborales" %}selected{% endif %}>
            Horas laborales
          </option>

          <option value="Crédito deportivo"
            {% if actividad.beneficio == "Crédito deportivo" %}selected{% endif %}>
            Crédito deportivo
          </option>

          <option value="Crédito social"
            {% if actividad.beneficio == "Crédito social" %}selected{% endif %}>
            Crédito social
          </option>

          <option value="Crédito cultural"
            {% if actividad.beneficio == "Crédito cultural" %}selected{% endif %}>
            Crédito cultural
          </option>
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label">Horas convalidables</label>
        <input type="number" name="horas_convalidables" class="form-control" min="0"
               value="{{ actividad.horas_convalidables }}">
      </div>

      <div class="col-12">
        <button class="btn btn-primary w-100">Guardar cambios</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
